<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | default: 'Notes on software engineering and focused writing by Fehmi Can Sağlam.' }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
  <title>{{ page.title | xml_escape }} - Fehmi Can Sağlam</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/pygments/default.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <div class="brand-block">
        <a class="brand" href="/">Fehmi Can Sağlam</a>
        <p class="brand-subtitle">I write to make the world a better place.</p>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <article class="page-card">
      <h1 class="page-title">{{ page.title | xml_escape }}</h1>
      <p class="post-meta">
        <span>{{ page.date | date: "%B %d, %Y" }}</span>
      </p>
      <div class="post-content">{{ content }}</div>
      <p class="post-signature">FCS</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>fehmicansaglam.net - since 2003</p>
      <a href="/about.html">About</a>
    </div>
  </footer>
</body>
</html>
